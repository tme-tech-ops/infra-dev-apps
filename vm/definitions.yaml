node_templates:
  ssh_keys:
    type: dell.nodes.keys.RSAKey
    properties:
      use_secret_store: true
      use_secrets_if_exist: true
      key_name: "example_key"
      resource_config:
        openssh_format: true
        key_name: "example_key"
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: keys.ne_ssh_key.operations.create
          inputs:
            store_public_key_material: false
            store_private_key_material: false
        delete: {}

  binary_image:
    type: dell.nodes.nativeedge.template.BinaryImage
    properties:
      binary_image_config:
        artifact:
          path: { get_input: binary_image_url }
          username: { get_input: binary_image_access_user }
          # Path into the Binary Configuration secret (the edge-plugin reads
          # the binary_image_access_token field), not a token value.
          access_token:
            get_secret:
              - { get_input: os_image_secret }
              - binary_image_access_token
        version: { get_input: binary_image_version }
    interfaces:
      dell.interfaces.lifecycle:
        precreate:
          implementation:
            edge.nativeedge_plugin.tasks.validate_binary_image_config
        create:
          implementation:
            edge.nativeedge_plugin.tasks.upload_binary
        delete:
          implementation:
            edge.nativeedge_plugin.tasks.delete_binary

  # Computes the serial-port and password runtime properties for the VM.
  # Nothing is created outside DAP, so there is nothing to undo on uninstall
  # (no delete/stop). Anything a deployment update must change is built in
  # the VM's own properties instead: this node isn't re-run by an update.
  prepare_config:
    type: dell.nodes.ApplicationModule
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: vm/scripts/prepare_serial_ports.py
          executor: central_deployment_agent
          inputs:
            serial_port: { get_input: serial_port }
        start:
          implementation: vm/scripts/prepare_passwd.py
          executor: central_deployment_agent
          inputs:
            vm_password: { get_secret: { get_input: vm_password } }

  # Renders the cloud-config into runtime properties only. It is consumed
  # by the VM, and removing the VM reverts it (no delete).
  cloudinit:
    type: dell.nodes.CloudInit.CloudConfig
    properties:
      resource_config:
        hostname: { get_input: vm_hostname }
        runcmd:
          - /usr/local/sbin/pin-nic-names
          - netplan apply
          - systemctl restart sshd
        write_files:
          - content: { get_attribute: [SELF, netplan_encoded] }
            encoding: b64
            path: /etc/netplan/50-cloud-init.yaml
          # Pins NIC names to MACs at first boot, so a NIC added by a
          # deployment update can't rename the management NIC.
          - content: { get_attribute: [SELF, netplan_pinned_encoded] }
            encoding: b64
            path: /etc/netplan-pinned.yaml.tmpl
            permissions: '0600'
          - content: { get_attribute: [SELF, pin_script_encoded] }
            encoding: b64
            path: /usr/local/sbin/pin-nic-names
            permissions: '0755'
          # NICs added after install get DHCP (no default route). The
          # netplan-generated files sort first, so pinned NICs are unaffected.
          - content: |
              [Match]
              Name=en*

              [Network]
              DHCP=ipv4

              [DHCPv4]
              UseRoutes=false
            path: /etc/systemd/network/99-added-nics.network
          - content: |
              ClientAliveInterval 1800
              ClientAliveCountMax 3
            path: /etc/ssh/sshd_config
            append: true
        disable_root_opts: >
          no-port-forwarding,no-agent-forwarding,no-X11-forwarding
        disable_root: false
        ssh_pwauth: true
        ssh_authorized_keys:
          - get_secret:
              concat:
                - get_attribute: [ssh_keys, secret_key_name]
                - "_public"
        users:
          - name: { get_input: vm_user_name }
            sudo: ['ALL=(ALL) NOPASSWD:ALL']
            groups: users, admin
            passwd: { get_attribute: [prepare_config, hashed_vm_passwd] }
            lock_passwd: false
            shell: /bin/bash
            ssh_authorized_keys:
              - get_secret:
                  concat:
                    - get_attribute: [ ssh_keys, secret_key_name ]
                    - "_public"
    interfaces:
      dell.interfaces.lifecycle:
        precreate:
          implementation: vm/scripts/prepare_netplan_config.py
          executor: central_deployment_agent
          inputs:
            template: vm/templates/netplan_config.yaml
            pin_script: vm/templates/pin_nic_names.sh
            parameters:
              use_dhcp: { get_input: use_dhcp }
              static_ip: { get_input: static_ip }
              use_gateway: { get_input: use_gateway }
              gateway: { get_input: gateway }
              use_dns: { get_input: use_dns }
              dns: { get_input: dns }
              add_second_nic: { get_input: add_second_nic }
              use_dhcp2: { get_input: use_dhcp2 }
              static_ip2: { get_input: static_ip2 }
              use_dns2: { get_input: use_dns2 }
              dns2: { get_input: dns2 }
        create:
          inputs:
            resource_config:
              merge:
                - { get_attribute: [SELF, resource_config] }
                - { get_input: cloudinit }
    relationships:
      - type: dell.relationships.depends_on
        target: ssh_keys
      - type: dell.relationships.depends_on
        target: prepare_config

  vm:
    type: dell.nodes.nativeedge.template.NativeEdgeVM
    properties:
      vm_config:
        location: { get_environment_capability: ece_service_tag }
        name: { get_sys: [deployment, name ] }
        image: { get_attribute: [binary_image, binary_details, extra, artifact_id] }
        os_type: { get_input: os_type }
        resource_constraints:
          cpu: { get_input: vcpus }
          memory: { get_input: memory_size }
          storage: { get_input: os_disk_size }
          disk: { get_input: disk }
          controller: { get_input: disk_controller }
        hardware_options:
          vTPM: { get_input: hardware_options.vTPM }
          secure_boot: { get_input: hardware_options.secure_boot }
          firmware_type: { get_input: hardware_options.firmware_type }
        enable_management: { get_input: enable_management }
        # Built from the inputs here (not by a script) so that a deployment
        # update sends the new segments and NAT rules. NIC 2 is dropped when
        # add_second_nic is false; NAT rules only apply with use_nat(2).
        network_settings:
          jmespath:
            - >-
              [?segment_name && enabled].{name: name,
              segment_name: segment_name, model_type: model_type,
              port_fwd_rules: (nat && port_fwd_rules) || `[]`}
            - - name: VNIC0
                enabled: true
                segment_name: { get_input: vnic_0_segment_name }
                model_type: VIRTIO
                nat: { get_input: use_nat }
                port_fwd_rules: { get_input: port_forward_rules }
              - name: VNIC1
                enabled: { get_input: add_second_nic }
                segment_name: { get_input: vnic_1_segment_name }
                model_type: VIRTIO
                nat: { get_input: use_nat2 }
                port_fwd_rules: { get_input: port_forward_rules2 }
        ports:
          usb: { get_input: usb }
          serial_port: { get_attribute: [prepare_config, serial_ports_list] }
          gpu: { get_input: gpu }
          video: { get_input: video }
          pcie: { get_input: pcie }
        cloudinit: { get_attribute: [cloudinit, cloud_config] }
        iso_files: { get_input: iso_files }
        boot_order: { get_input: boot_order }
        additional_disks: { get_input: additional_disks }
    interfaces:
      dell.interfaces.lifecycle:
        # Replaces the edge-plugin's check_drift, which always reports drift:
        # an update that doesn't change the VM no longer sends it a no-op
        # update (which the Endpoint sometimes never completes).
        check_drift:
          implementation: vm/scripts/vm_check_drift.py
          executor: central_deployment_agent
        # The edge-plugin's update_config/update_apply apply the
        # change. This compares the VM record with what was sent, so an
        # update that completes without applying anything fails visibly.
        # update_postapply, not postupdate: the update workflow runs
        # preupdate/update/postupdate before update_config/update_apply.
        update_postapply:
          implementation: vm/scripts/vm_postupdate.py
          executor: central_deployment_agent
    relationships:
       - type: dell.relationships.depends_on
         target: cloudinit
       - type: dell.relationships.depends_on
         target: binary_image
       - type: dell.relationships.depends_on
         target: prepare_config

  # Resolves the Endpoint proxy settings and reads the VM IP into runtime
  # properties. Nothing to undo on uninstall (no delete/stop).
  vm_info:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: vm/scripts/get_target_id.py
          executor: central_deployment_agent
        start:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: vm/scripts/get_vm_info.sh
            fabric_env:
              host_string:
                get_attribute: [vm, vm_details, name]
              user:
                get_input: vm_user_name
              key:
                get_secret:
                  concat:
                    - get_attribute: [ ssh_keys, secret_key_name ]
                    - "_private"
              port: 22
            proxy_settings:
              get_attribute: [ SELF, connection_proxy_settings ]
        preupdate:
          implementation: vm/scripts/get_target_id.py
          executor: central_deployment_agent
        update:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: vm/scripts/get_vm_info.sh
            fabric_env:
              host_string:
                get_attribute: [vm, vm_details, name]
              user:
                get_input: vm_user_name
              key:
                get_secret:
                  concat:
                    - get_attribute: [ ssh_keys, secret_key_name ]
                    - "_private"
              port: 22
            proxy_settings:
                get_attribute: [ SELF, connection_proxy_settings ]
    relationships:
       - type: dell.relationships.depends_on
         target: vm
