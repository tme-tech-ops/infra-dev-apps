inputs:

  nodered_name:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: Node-RED Container Name
    description: |
      Name of the Node-RED container on the Endpoint.
    default: "nodered"
    constraints:
      - pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,62}$
        error_message: Must start with a letter or number and contain only letters, numbers, underscores, dots or hyphens (max 63).
    display:
      group: nodered
      index: 1

  nodered_url:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: Node-RED Image
    description: |
      Image reference (registry/repository:tag) of the Node-RED container.
      The registry must be included, e.g. mirror.gcr.io/nodered/node-red:latest.
    default: "mirror.gcr.io/nodered/node-red:latest"
    constraints:
      - pattern: ^[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?/[a-z0-9._/-]+(:[a-zA-Z0-9._-]+)?$
        error_message: Must be registry/repository[:tag], e.g. mirror.gcr.io/nodered/node-red:latest.
    display:
      group: nodered
      index: 2

  influxdb_name:
