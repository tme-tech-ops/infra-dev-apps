inputs:

  ansible_debug_level:
    type: integer
    hidden: false
    required: true
    allow_update: true
    display_label: Ansible Debug Level
    description: |
      Ansible verbosity level (0 to 3).
    default: 0
    constraints:
      - in_range: [0, 3]
        error_message: Must be between 0 and 3.
    display:
      group: ansible_settings
      index: 4

  ansible_timeout:
    type: integer
    hidden: false
    required: true
    allow_update: true
    display_label: Ansible Timeout
    description: |
      Timeout for each Ansible playbook run, in seconds (60 to 86400).
    default: 3600
    constraints:
      - in_range: [60, 86400]
        error_message: Must be between 60 and 86400 seconds.
    display:
      group: ansible_settings
      index: 5

  ansible_log_stdout:
    type: boolean
    hidden: false
    required: true
    allow_update: true
    display_label: Ansible Log Output
    description: |
      Send Ansible playbook output to the deployment logs. Leave disabled
      for faster deployments.
    default: false
    constraints:
      - valid_values: [true, false]
        error_message: Must be true or false.
    display:
      group: ansible_settings
      index: 6


# Registry Inputs

  use_docker_authentication:
    type: boolean
    hidden: false
    required: true
    allow_update: false
    display_label: Use Docker Authentication
    description: |
      Log the VM's Docker engine in to a container registry before pulling
      the MQTT and Node-RED images.
    default: false
    constraints:
      - valid_values: [true, false]
        error_message: Must be true or false.
    display:
      group: registry
      index: 10

  registry_url:
    type: string
    hidden: false
    only_with: use_docker_authentication
    allow_update: false
    display_label: Registry URL
    required: false
    description: |
      Registry host with optional port and path, without a scheme
      (default docker.io).
    default: "docker.io"
    constraints:
      - pattern: '^$|^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?(:[0-9]{1,5})?(/[a-zA-Z0-9._/-]*)?$'
        error_message: Must be a registry host[:port][/path] without http:// or https://.
    display:
      group: registry
      index: 15

  registry_credentials:
    type: secret_key
    hidden: false
    only_with: use_docker_authentication
    required: false
    allow_update: false
    display_label: Registry Credentials Secret
    description: |
      Name of a Docker Configuration secret holding the registry username
      and password.
    constraints:
      - type: docker_configuration_secret_name
        error_message: Select a Docker Configuration secret.
    display:
      group: registry
      index: 20
