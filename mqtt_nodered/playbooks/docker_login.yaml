---
- name: Log in to the container registry
  hosts: all
  become: true

  tasks:
    # The password goes in on stdin and no_log keeps it out of the process
    # list and the deployment logs.
    - name: Docker login
      ansible.builtin.command:
        argv:
          - docker
          - login
          - "{{ registry_url }}"
          - --username
          - "{{ registry_username }}"
          - --password-stdin
        stdin: "{{ registry_password }}"
      no_log: true
      changed_when: true
