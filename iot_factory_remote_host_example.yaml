tosca_definitions_version: dell_1_1

description: >
  This blueprint connects to a remote Ubuntu 24.04 host over SSH and uses Ansible
  to turn a fresh install into an IoT Smart Factory demo: Docker, a Mosquitto MQTT
  broker, Node-RED (packaging-line simulator, fault injection and alert rules),
  InfluxDB and a provisioned Grafana dashboard.

imports:
  - dell/types/types.yaml
  - plugin:ansible-plugin?version= >=4.1.9.0,<5.0.0.0
  - iot_factory/definitions.yaml
  - iot_factory/inputs.yaml
  - iot_factory/outputs.yaml

input_groups:
  remote_host:
    display_label: Remote host credentials
    collapsible: false
    index: 0
    inputs:
      - remote_host
      - remote_username
      - ssh_private_key
      - remote_port
  factory:
    display_label: Smart Factory Demo
    collapsible: true
    index: 1
    inputs:
      - stack_admin_credentials
      - factory_site
      - factory_line
      - publish_interval
      - auto_chaos
      - grafana_anonymous_viewer
  ports:
    display_label: Service Ports
    collapsible: true
    index: 2
    inputs:
      - mqtt_port
      - nodered_port
      - grafana_port
      - influxdb_port
      - mqtt_ws_port
      - mqttx_web_port
  join:
    display_label: Join Another Factory
    collapsible: true
    index: 3
    inputs:
      - join_hub
      - hub_deployment_id
  ansible_settings:
    display_label: Ansible Settings
    collapsible: true
    index: 4
    inputs:
      - ansible_debug_level
      - ansible_timeout
      - ansible_log_stdout

labels:
  csys-obj-type:
    values:
      - environment
  env:
    values:
      - remote
  solution:
    values:
      - tme-tech-ops
  version:
    values:
      - "4.0.0"

blueprint_labels:
  env:
    values:
      - remote
