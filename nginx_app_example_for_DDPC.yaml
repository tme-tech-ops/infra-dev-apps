tosca_definitions_version: dell_1_1

description: >
  This blueprint Deploys an NGINX server to serve static files on an existing example VM deployment

imports:
  - dell/types/types.yaml
  - plugin:fabric-plugin?version= >=3.4.3.0,<4.0.0.0
  - nginx_app/definitions.yaml
  - nginx_app/inputs.yaml
  - nginx_app/outputs.yaml

input_groups:
  nginx_settings:
    display_label: Nginx Settings
    collapsible: true
    index: 1
    inputs:
      - nginx_credentials_secret
      - enable_http_redirect
      - nginx_port
      - browser_title
      - body_title
      - nginx_debug
  certificate:
    display_label: Self-Signed Certificate
    collapsible: true
    index: 2
    inputs:
      - duration_days
      - common_name
      - country
      - state
      - location
      - organization

labels:
  csys-obj-type:
    values:
      - environment
  env:
    values:
      - ddpc
  solution:
    values:
      - tme-tech-ops
  version:
    values:
      - "4.0.0"

blueprint_labels:
  env:
    values:
      - ddpc