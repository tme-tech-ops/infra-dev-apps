dsl_definitions:

  # Terse, readable Ansible output for the DAP event log (see
  # iot_factory/definitions.yaml for why the iot_factory callback is used).
  ansible_env_vars: &ansible_env_vars
    ANSIBLE_HOST_KEY_CHECKING: "False"
    ANSIBLE_INVALID_TASK_ATTRIBUTE_FAILED: "False"
    ANSIBLE_STDOUT_CALLBACK: iot_factory
    ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
    ANSIBLE_DISPLAY_SKIPPED_HOSTS: "False"
    ANSIBLE_DEPRECATION_WARNINGS: "False"
    ANSIBLE_PYTHON_INTERPRETER: auto_silent
    ANSIBLE_NOCOLOR: "True"
    # The eo-proxy publishes each session as a new cluster service, and its DNS
    # name takes up to a minute or two to resolve. SSH retries (exit 255, with
    # backoff of up to 30 s) wait for it inside the run, so a plugin-level retry
    # isn't spent on it.
    ANSIBLE_SSH_RETRIES: "10"

  # The VM's IP on its first NIC, read by vm_info. Services are published on it.
  factory_host_ip: &factory_host_ip
    get_attribute: [vm_info, vm_public_ip]

  # Playbooks reach the VM through the DDPC Endpoint proxy (ECANS) resolved by
  # vm_info, so the VM doesn't need to be reachable from the orchestrator. The
  # plugin swaps ip/port for the proxy address at run time. Proxy addresses are
  # reused, so host keys are not recorded.
  vm_inventory: &vm_inventory
    inventory_proxy_settings:
      factory_host:
        ip: { get_attribute: [vm, vm_details, name] }
        port: 22
        proxy_settings: { get_attribute: [vm_info, connection_proxy_settings] }
    sources:
      all:
        hosts:
          factory_host:
            ansible_host: { get_attribute: [SELF, inventory_proxy_settings, factory_host, ip] }
            ansible_port: { get_attribute: [SELF, inventory_proxy_settings, factory_host, port] }
            ansible_user: { get_input: vm_user_name }
            ansible_ssh_private_key_file:
              get_secret:
                concat:
                  - get_attribute: [ssh_keys, secret_key_name]
                  - "_private"
            ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            ansible_become: true
    ansible_env_vars: *ansible_env_vars

  ansible_common_properties: &ansible_common_properties
    <<: *vm_inventory
    ansible_external_venv: /opt/ansible
    log_stdout: { get_input: ansible_log_stdout }
    store_facts: false
    timeout: { get_input: ansible_timeout }
    debug_level: { get_input: ansible_debug_level }
    # The plugin retries failed playbooks (exit code 2) as well as unreachable
    # hosts. The playbooks retry transient steps themselves, so one extra
    # attempt is enough.
    number_of_attempts: 2

  # Variables shared by the stack playbooks (deploy, verify).
  stack_run_data: &stack_run_data
    factory_site: { get_input: factory_site }
    factory_line: { get_input: factory_line }
    publish_interval: { get_input: publish_interval }
    auto_chaos: { get_input: auto_chaos }
    grafana_anonymous_viewer: { get_input: grafana_anonymous_viewer }
    mqtt_port: { get_input: mqtt_port }
    nodered_port: { get_input: nodered_port }
    grafana_port: { get_input: grafana_port }
    influxdb_port: { get_input: influxdb_port }
    mqtt_ws_port: { get_input: mqtt_ws_port }
    mqttx_web_port: { get_input: mqttx_web_port }
    bridge_port: { get_input: bridge_port }
    public_host: *factory_host_ip
    admin_username: { get_secret: [{ get_input: stack_admin_credentials }, username] }
    admin_password: { get_secret: [{ get_input: stack_admin_credentials }, password] }

# Same playbook chain as the remote-host entry, run inside the DDPC VM.
# Uninstall removes the VM, which removes Docker, the stack and any bridge, so
# the teardown playbooks are not needed here (no stop operations).
node_templates:

  # Fails fast unless the VM is Ubuntu 24.04 with enough resources, free ports
  # and internet access (check the OS Image Secret and the network segment).
  preflight:
    type: dell.nodes.ansible.Executor
    properties:
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/preflight.yaml
      # A failed check is final: fail fast instead of retrying.
      number_of_attempts: 1
      run_data:
        required_ports:
          - { get_input: mqtt_port }
          - { get_input: nodered_port }
          - { get_input: grafana_port }
          - { get_input: influxdb_port }
          - { get_input: mqtt_ws_port }
          - { get_input: mqttx_web_port }
          - { get_input: bridge_port }
    relationships:
      - type: dell.relationships.depends_on
        target: vm_info

  # Docker CE from the official apt repository.
  install_docker:
    type: dell.nodes.ansible.Executor
    properties:
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/install_docker.yaml
    relationships:
      - type: dell.relationships.depends_on
        target: preflight

  # Mosquitto, Node-RED, InfluxDB and Grafana under /opt/iot-factory.
  deploy_stack:
    type: dell.nodes.ansible.Executor
    properties:
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/deploy_stack.yaml
      run_data: *stack_run_data
      sensitive_keys:
        - ansible_password
        - admin_password
    relationships:
      - type: dell.relationships.depends_on
        target: install_docker

  # End-to-end check that the demo is live: telemetry on MQTT, points in
  # InfluxDB, Grafana dashboard provisioned, Node-RED auth enforced.
  verify_demo:
    type: dell.nodes.ansible.Executor
    properties:
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/verify_demo.yaml
      run_data: *stack_run_data
      sensitive_keys:
        - ansible_password
        - admin_password
    relationships:
      - type: dell.relationships.depends_on
        target: deploy_stack

  # Optional (hub side): a bridge listener with its own credentials and an ACL.
  # Instantiated only when accept_joins is true.
  accept_joins:
    type: dell.nodes.ansible.Executor
    capabilities:
      scalable:
        properties:
          default_instances:
            jmespath:
              - 'length([?accept_joins == `true`]) || `0`'
              - [{"accept_joins": { get_input: accept_joins }}]
    properties:
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/accept_joins.yaml
      run_data:
        factory_site: { get_input: factory_site }
        factory_line: { get_input: factory_line }
        bridge_port: { get_input: bridge_port }
        admin_username: { get_secret: [{ get_input: stack_admin_credentials }, username] }
        bridge_username: { get_secret: [{ get_input: bridge_credentials }, username] }
        bridge_password: { get_secret: [{ get_input: bridge_credentials }, password] }
      sensitive_keys:
        - ansible_password
        - bridge_password
    relationships:
      - type: dell.relationships.depends_on
        target: verify_demo

  # Optional: bridge this factory's line into a hub factory (a deployment of
  # either IoT Smart Factory entry). Instantiated only when join_hub is true.
  join_hub:
    type: dell.nodes.ansible.Executor
    capabilities:
      scalable:
        properties:
          default_instances:
            jmespath:
              - 'length([?join_hub == `true`]) || `0`'
              - [{"join_hub": { get_input: join_hub }}]
    properties:
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/join_hub.yaml
      run_data:
        factory_site: { get_input: factory_site }
        factory_line: { get_input: factory_line }
        hub_host: { get_capability: [{ get_input: hub_deployment_id }, mqtt_host] }
        hub_port: { get_capability: [{ get_input: hub_deployment_id }, bridge_port] }
        hub_accepts_joins: { get_capability: [{ get_input: hub_deployment_id }, accepts_joins] }
        hub_topic_root: { get_capability: [{ get_input: hub_deployment_id }, mqtt_topic_root] }
        hub_username:
          get_secret:
            - { get_capability: [{ get_input: hub_deployment_id }, bridge_credentials] }
            - username
        hub_password:
          get_secret:
            - { get_capability: [{ get_input: hub_deployment_id }, bridge_credentials] }
            - password
      sensitive_keys:
        - ansible_password
        - hub_password
    relationships:
      - type: dell.relationships.depends_on
        target: verify_demo
