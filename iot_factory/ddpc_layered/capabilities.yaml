dsl_definitions:

  # The parent simple_vm's IP on its first NIC. On a NAT segment this is the
  # VM's private address: add port-forward rules for the service ports.
  factory_host_ip: &factory_host_ip
    get_environment_capability: vm_ip

capabilities:

  grafana_dashboard_url:
    description: Grafana IoT Smart Factory dashboard (kiosk mode)
    value:
      concat:
        - 'http://'
        - *factory_host_ip
        - ':'
        - { get_input: grafana_port }
        - '/d/iot-factory/iot-smart-factory?kiosk&refresh=5s'

  control_room_url:
    description: Factory control room (live line view, fault buttons, scenarios, terminal, live MQTT feed)
    value: { concat: ['http://', *factory_host_ip, ':', { get_input: nodered_port }, '/control'] }

  mqttx_web_url:
    description: MQTTX Web browser MQTT client (connect to mqtt_websocket_url with the stack admin login)
    value: { concat: ['http://', *factory_host_ip, ':', { get_input: mqttx_web_port }] }

  mqtt_websocket_url:
    description: MQTT over websockets endpoint for browser clients
    value: { concat: ['ws://', *factory_host_ip, ':', { get_input: mqtt_ws_port }, '/mqtt'] }

  mqtt_host:
    description: MQTT broker host (also used by factories that join this one)
    value: *factory_host_ip

  mqtt_port:
    description: MQTT broker port for clients
    value: { get_input: mqtt_port }

  accepts_joins:
    description: Whether other factories can join this one (Accept Joins)
    value: { get_input: accept_joins }

  bridge_port:
    description: Bridge listener port for joining factories
    value: { get_input: bridge_port }

  bridge_credentials:
    description: Name of the secret joining factories use to connect (empty unless Accept Joins is on)
    value: { get_input: bridge_credentials }

  nodered_editor_url:
    description: Node-RED editor (simulator, fault injection buttons and alert rules)
    value: { concat: ['http://', *factory_host_ip, ':', { get_input: nodered_port }, '/'] }

  fault_injection_api:
    description: >-
      Fault injection REST endpoint (basic auth with the stack admin login). POST JSON
      {"machine":"press-01|cnc-02|robot-03|all","fault":"overheat|hydraulic_leak|bearing|tool_wear|jam|misgrip|none"}
      with optional "site" and "line" to reach a joined factory
    value: { concat: ['http://', *factory_host_ip, ':', { get_input: nodered_port }, '/api/fault'] }

  mqtt_endpoint:
    description: MQTT broker endpoint (username and password from the stack admin login)
    value: { concat: ['tcp://', *factory_host_ip, ':', { get_input: mqtt_port }] }

  mqtt_topic_root:
    description: >-
      MQTT topic root. Telemetry at <root>/<machine>/telemetry, commands at
      <root>/<machine>/cmd, alerts at <root>/alerts
    value: { concat: ['factory/', { get_input: factory_site }, '/', { get_input: factory_line }] }

  influxdb_url:
    description: InfluxDB UI and API (org iot-factory, bucket telemetry, dashboard IoT Factory - Database Health)
    value: { concat: ['http://', *factory_host_ip, ':', { get_input: influxdb_port }] }

  stack_admin_credentials:
    description: Name of the secret holding the stack admin username and password
    value: { get_input: stack_admin_credentials }
