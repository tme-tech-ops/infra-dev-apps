dsl_definitions:

  # Terse, readable Ansible output for the DAP event log. The plugin logs the
  # whole playbook stdout on failure, and with the json callback it also reports
  # every task as an "Error on host". It also always passes -v, which makes the
  # default callback dump every task result. The iot_factory callback
  # (playbooks/callback_plugins) is the default callback one verbosity level
  # lower: one header and one status line per task, skipped hosts hidden.
  ansible_env_vars: &ansible_env_vars
    ANSIBLE_HOST_KEY_CHECKING: "False"
    ANSIBLE_INVALID_TASK_ATTRIBUTE_FAILED: "False"
    ANSIBLE_STDOUT_CALLBACK: iot_factory
    ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
    ANSIBLE_DISPLAY_SKIPPED_HOSTS: "False"
    ANSIBLE_DEPRECATION_WARNINGS: "False"
    ANSIBLE_PYTHON_INTERPRETER: auto_silent
    ANSIBLE_NOCOLOR: "True"

  # Direct SSH to the remote host (no DDPC Endpoint proxy).
  remote_inventory: &remote_inventory
    sources:
      all:
        hosts:
          factory_host:
            ansible_host: { get_input: remote_host }
            ansible_port: { get_input: remote_port }
            ansible_user: { get_input: remote_username }
            ansible_ssh_private_key_file: { get_secret: { get_input: ssh_private_key } }
            ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            ansible_become: true
    proxy_settings:
      disable: true
    ansible_env_vars: *ansible_env_vars

  ansible_common_properties: &ansible_common_properties
    <<: *remote_inventory
    ansible_external_venv: /opt/ansible
    log_stdout: { get_input: ansible_log_stdout }
    store_facts: false
    timeout: { get_input: ansible_timeout }
    debug_level: { get_input: ansible_debug_level }
    # The plugin retries failed playbooks (exit code 2) as well as unreachable
    # hosts. The playbooks retry transient steps themselves, so one extra
    # attempt is enough.
    number_of_attempts: 2

  # Variables shared by the stack playbooks (deploy, verify, teardown).
  stack_run_data: &stack_run_data
    factory_site: { get_input: factory_site }
    factory_line: { get_input: factory_line }
    publish_interval: { get_input: publish_interval }
    auto_chaos: { get_input: auto_chaos }
    grafana_anonymous_viewer: { get_input: grafana_anonymous_viewer }
    mqtt_port: { get_input: mqtt_port }
    nodered_port: { get_input: nodered_port }
    grafana_port: { get_input: grafana_port }
    influxdb_port: { get_input: influxdb_port }
    mqtt_ws_port: { get_input: mqtt_ws_port }
    mqttx_web_port: { get_input: mqttx_web_port }
    public_host: { get_input: remote_host }
    admin_username: { get_secret: [{ get_input: stack_admin_credentials }, username] }
    admin_password: { get_secret: [{ get_input: stack_admin_credentials }, password] }

node_templates:

  # Fails fast (before any change) unless the host is Ubuntu 24.04 with
  # enough resources, free ports and internet access.
  preflight:
    type: dell.nodes.ansible.Executor
    properties:
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/preflight.yaml
      # A failed check is final: fail fast instead of retrying.
      number_of_attempts: 1
      run_data:
        required_ports:
          - { get_input: mqtt_port }
          - { get_input: nodered_port }
          - { get_input: grafana_port }
          - { get_input: influxdb_port }
          - { get_input: mqtt_ws_port }
          - { get_input: mqttx_web_port }

  # Docker CE from the official apt repository. Uninstall removes Docker only
  # if this blueprint installed it.
  install_docker:
    type: dell.nodes.ansible.Executor
    properties: &install_docker_properties
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/install_docker.yaml
    interfaces:
      dell.interfaces.lifecycle:
        stop:
          implementation: ansible.plugins_ansible.tasks.run
          inputs:
            <<: *install_docker_properties
            playbook_path: iot_factory/playbooks/teardown_docker.yaml
    relationships:
      - type: dell.relationships.depends_on
        target: preflight

  # Mosquitto, Node-RED, InfluxDB and Grafana under /opt/iot-factory.
  # Uninstall runs compose down (volumes and images) and removes the directory.
  deploy_stack:
    type: dell.nodes.ansible.Executor
    properties: &deploy_stack_properties
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/deploy_stack.yaml
      run_data: *stack_run_data
      sensitive_keys:
        - ansible_password
        - admin_password
    interfaces:
      dell.interfaces.lifecycle:
        stop:
          implementation: ansible.plugins_ansible.tasks.run
          inputs:
            <<: *deploy_stack_properties
            playbook_path: iot_factory/playbooks/teardown_stack.yaml
    relationships:
      - type: dell.relationships.depends_on
        target: install_docker

  # End-to-end check that the demo is live: telemetry on MQTT, points in
  # InfluxDB, Grafana dashboard provisioned, Node-RED auth enforced.
  verify_demo:
    type: dell.nodes.ansible.Executor
    properties:
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/verify_demo.yaml
      run_data: *stack_run_data
      sensitive_keys:
        - ansible_password
        - admin_password
    relationships:
      - type: dell.relationships.depends_on
        target: deploy_stack

  # Optional: bridge this factory's line into a hub factory (another deployment
  # of this blueprint). Instantiated only when join_hub is true, so the hub
  # capabilities and secret are never looked up for a standalone factory.
  join_hub:
    type: dell.nodes.ansible.Executor
    capabilities:
      scalable:
        properties:
          default_instances:
            jmespath:
              - 'length([?join_hub == `true`]) || `0`'
              - [{"join_hub": { get_input: join_hub }}]
    properties: &join_hub_properties
      <<: *ansible_common_properties
      playbook_path: iot_factory/playbooks/join_hub.yaml
      run_data:
        factory_site: { get_input: factory_site }
        factory_line: { get_input: factory_line }
        hub_host: { get_capability: [{ get_input: hub_deployment_id }, mqtt_host] }
        hub_port: { get_capability: [{ get_input: hub_deployment_id }, mqtt_port] }
        hub_topic_root: { get_capability: [{ get_input: hub_deployment_id }, mqtt_topic_root] }
        hub_username:
          get_secret:
            - { get_capability: [{ get_input: hub_deployment_id }, stack_admin_credentials] }
            - username
        hub_password:
          get_secret:
            - { get_capability: [{ get_input: hub_deployment_id }, stack_admin_credentials] }
            - password
      sensitive_keys:
        - ansible_password
        - hub_password
    interfaces:
      dell.interfaces.lifecycle:
        stop:
          implementation: ansible.plugins_ansible.tasks.run
          inputs:
            <<: *join_hub_properties
            playbook_path: iot_factory/playbooks/leave_hub.yaml
    relationships:
      - type: dell.relationships.depends_on
        target: verify_demo
