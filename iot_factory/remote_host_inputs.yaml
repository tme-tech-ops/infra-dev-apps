inputs:

# Remote host

  remote_host:
    type: string
    hidden: false
    allow_update: false
    display_label: Remote Host IP Or FQDN
    description: |
      IP address or FQDN of the Ubuntu 24.04 host the demo is installed on.
      It must be reachable over SSH from the orchestrator.
    constraints:
      - pattern: ^[a-zA-Z0-9]([a-zA-Z0-9.:-]*[a-zA-Z0-9])?$
        error_message: Must be an IP address or hostname (letters, numbers, dots, colons and hyphens).
    display:
      group: remote_host
      index: 0

  remote_username:
    type: string
    hidden: false
    allow_update: false
    display_label: Remote Host Username
    description: |
      SSH login user on the remote host. Must be root or have passwordless
      sudo (ALL=(ALL) NOPASSWD:ALL).
    constraints:
      - pattern: ^[a-z_][a-z0-9_-]{0,31}$
        error_message: Must be a valid Linux username (lowercase letters, digits, underscores, hyphens).
    display:
      group: remote_host
      index: 1

  ssh_private_key:
    type: secret_key
    hidden: false
    allow_update: false
    display_label: SSH Private Key Secret
    description: |
      Name of the SSH private key secret matching an authorized_keys entry
      on the remote host.
    constraints:
      - type: ssh_private_key
        error_message: Select an SSH private key secret.
    display:
      group: remote_host
      index: 2

  remote_port:
    type: integer
    hidden: false
    allow_update: false
    display_label: Remote Host SSH Port
    description: |
      TCP port of the SSH server on the remote host.
    default: 22
    constraints:
      - in_range: [1, 65535]
        error_message: Must be a TCP port between 1 and 65535.
    display:
      group: remote_host
      index: 3
