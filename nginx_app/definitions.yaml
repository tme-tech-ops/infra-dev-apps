dsl_definitions:

  # SSH connection to the parent simple_vm deployment's VM, routed through
  # the DDPC Endpoint proxy (connection_proxy_settings set by vm_info).
  vm_connection: &vm_connection
    host_string:
      get_environment_capability: vm_name
    user:
      get_environment_capability: vm_user_name
    key:
      get_secret: { get_environment_capability: vm_ssh_private_key }
    port: 22

  # Fabric exports shell_env values unquoted, so the credentials are
  # single-quote-wrapped to survive spaces and shell metacharacters.
  nginx_install_env: &nginx_install_env
    ## Self-Signed Certificate info
    DURATION_DAYS: { get_input: duration_days }
    ARTIFACT_COMMON_NAME: { get_input: common_name }
    COUNTRY: { get_input: country }
    STATE: { get_input: state }
    LOCATION: { get_input: location }
    ORGANIZATION: { get_input: organization }
    ## Basic Authentication info
    NGINX_HTUSER:
      concat:
        - "'"
        - { get_secret: [{ get_input: nginx_credentials_secret }, username] }
        - "'"
    NGINX_HTPASS:
      concat:
        - "'"
        - { get_secret: [{ get_input: nginx_credentials_secret }, password] }
        - "'"
    ## TCP Port and Server titles
    ENABLE_HTTP_REDIRECT: { get_input: enable_http_redirect }
    NGINX_PORT: { get_input: nginx_port }
    BROWSER_TITLE: { concat: ["'", { get_input: browser_title }, "'"] }
    BODY_TITLE: { concat: ["'", { get_input: body_title }, "'"] }
    DEBUG: { get_input: nginx_debug }

node_templates:

  # Resolves the parent VM's Endpoint proxy settings and confirms the VM is
  # reachable. It only sets runtime properties, so there is nothing to undo
  # on uninstall (no delete/stop).
  vm_info:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: vm/scripts/get_target_id.py
          executor: central_deployment_agent
          inputs:
            service_tag: { get_environment_capability: service_tag }
        start:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: vm/scripts/get_vm_info.sh
            fabric_env: *vm_connection
            proxy_settings:
              get_attribute: [ SELF, connection_proxy_settings ]
        preupdate:
          implementation: vm/scripts/get_target_id.py
          executor: central_deployment_agent
          inputs:
            service_tag: { get_environment_capability: service_tag }
        update:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: vm/scripts/get_vm_info.sh
            fabric_env: *vm_connection
            proxy_settings:
              get_attribute: [ SELF, connection_proxy_settings ]

  install_file_server:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          executor: central_deployment_agent
          implementation: fabric.fabric_plugin.tasks.run_commands
          inputs:
            commands:
              - rm -rf nginx-static-files
              - git clone -q https://github.com/Chubtoad5/nginx-static-files.git
              - sudo chmod +x nginx-static-files/install_nginx.sh
              - sudo -E ./nginx-static-files/install_nginx.sh
            fabric_env:
              <<: *vm_connection
              shell_env: *nginx_install_env
            proxy_settings:
              get_attribute: [ vm_info, connection_proxy_settings ]
        delete:
          executor: central_deployment_agent
          implementation: fabric.fabric_plugin.tasks.run_commands
          inputs:
            commands:
              - test -d nginx-static-files || git clone -q https://github.com/Chubtoad5/nginx-static-files.git
              - sudo chmod +x nginx-static-files/install_nginx.sh
              - sudo -E ./nginx-static-files/install_nginx.sh
              - rm -rf nginx-static-files
            fabric_env:
              <<: *vm_connection
              shell_env:
                INSTALL_SERVER: "false"
                DELETE_SERVER: "true"
                DELETE_DATA: "true"
                DEBUG: { get_input: nginx_debug }
            proxy_settings:
              get_attribute: [ vm_info, connection_proxy_settings ]
    relationships:
       - type: dell.relationships.depends_on
         target: vm_info
