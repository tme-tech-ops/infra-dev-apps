inputs:

# Self-Signed Certificate Inputs
  duration_days:
    type: integer
    hidden: false
    required: true
    allow_update: true
    display_label: Self-Signed Certificate Duration
    description: |
      Validity of the self-signed certificate, in days (1 to 3650).
    default: 365
    constraints:
      - in_range: [1, 3650]
        error_message: Must be between 1 and 3650 days.
    display:
      group: certificate
      index: 3

  common_name:
    type: string
    hidden: false
    required: true
    allow_update: true
    display_label: Self-Signed Certificate Common Name
    description: |
      Common Name (CN) of the self-signed certificate, usually the server's FQDN.
    default: "artifacts.edge.lab"
    constraints:
      - pattern: ^[a-zA-Z0-9*]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$
        error_message: Must be a hostname or FQDN (letters, numbers, dots and hyphens).
    display:
      group: certificate
      index: 4

  country:
    type: string
    hidden: false
    required: true
    allow_update: true
    display_label: Self-Signed Certificate Country
    description: |
      Two-letter ISO country code of the self-signed certificate (e.g. US).
    default: "US"
    constraints:
      - pattern: ^[A-Z]{2}$
        error_message: Must be a two-letter uppercase country code, e.g. US.
    display:
      group: certificate
      index: 5

  state:
    type: string
    hidden: false
    required: true
    allow_update: true
    display_label: Self-Signed Certificate State
    description: |
      State or province of the self-signed certificate.
    default: "MA"
    constraints:
      - pattern: ^[^'"]{1,64}$
        error_message: Must be 1 to 64 characters, without quotes.
    display:
      group: certificate
      index: 6

  location:
    type: string
    hidden: false
    required: true
    allow_update: true
    display_label: Self-Signed Certificate Location
    description: |
      City or locality of the self-signed certificate.
    default: "Hopkinton"
    constraints:
      - pattern: ^[^'"]{1,64}$
        error_message: Must be 1 to 64 characters, without quotes.
    display:
      group: certificate
      index: 7

  organization:
    type: string
    hidden: false
    required: true
    allow_update: true
    display_label: Self-Signed Certificate Organization
    description: |
      Organization of the self-signed certificate.
    default: "EdgeLab"
    constraints:
      - pattern: ^[^'"]{1,64}$
        error_message: Must be 1 to 64 characters, without quotes.
    display:
      group: certificate
      index: 8

# NGINX Basic Authentication
  nginx_credentials_secret:
    type: secret_key
    hidden: false
    required: true
    allow_update: false
    display_label: Basic Authentication Credentials Secret
    description: |
      Name of a Basic Auth Credentials secret holding the NGINX basic
      authentication username and password. The password must not contain
      a single quote (').
    constraints:
      - type: basic_auth_credentials
        error_message: Select a Basic Auth Credentials secret.
    display:
      group: nginx_settings
      index: 9

# Web Server Configuration
  enable_http_redirect:
    type: boolean
    hidden: false
    required: true
    allow_update: true
    display_label: Enable HTTP Redirect
    description: |
      Redirect plain HTTP (port 80) requests to HTTPS.
    default: true
    constraints:
      - valid_values: [true, false]
        error_message: Must be true or false.
    display:
      group: nginx_settings
      index: 11

  nginx_port:
    type: integer
    hidden: false
    required: true
    allow_update: true
    display_label: Nginx Port
    description: |
      TCP port NGINX serves HTTPS on.
    default: 443
    constraints:
      - in_range: [1, 65535]
        error_message: Must be a TCP port between 1 and 65535.
    display:
      group: nginx_settings
      index: 12

  browser_title:
    type: string
    hidden: false
    required: true
    allow_update: true
    display_label: Nginx Browser Title
    description: |
      Title shown in the browser tab.
    default: "Artifact Server"
    constraints:
      - pattern: ^[^'"]{1,64}$
        error_message: Must be 1 to 64 characters, without quotes.
    display:
      group: nginx_settings
      index: 13

  body_title:
    type: string
    hidden: false
    required: true
    allow_update: true
    display_label: Nginx Body Title
    description: |
      Heading shown on the page.
    default: "Artifact Server"
    constraints:
      - pattern: ^[^'"]{1,64}$
        error_message: Must be 1 to 64 characters, without quotes.
    display:
      group: nginx_settings
      index: 14

  nginx_debug:
    type: integer
    hidden: false
    required: true
    allow_update: true
    display_label: Debug Logging
    description: |
      Set to 1 to enable install-script debug logging, or 0 to disable it.
    default: 0
    constraints:
      - valid_values: [0, 1]
        error_message: Must be 0 or 1.
    display:
      group: nginx_settings
      index: 15
