tosca_definitions_version: dell_1_1

description: >
  Deploys the Site IT Toolkit directly on a Dell Distributed Private Cloud
  (DDPC) Endpoint with the edge-plugin NativeEdgeCompose node type: a Gatus
  status page that watches the site's uplink, DNS and a key service, ntfy
  push alerts, an OpenSpeedTest LAN speed test and the IT-Tools toolbox.
  The stack is configured entirely in the compose file shipped with the
  blueprint. Images come from Docker Hub or a mirror, with an optional
  registry login (basic-auth secret, TLS verification).

imports:
  - dell/types/types.yaml
  - plugin:edge-plugin?version= >=3.3.25.0,<3.3.26.0
  - site_it_toolkit/definitions.yaml
  - site_it_toolkit/inputs.yaml
  - site_it_toolkit/capabilities.yaml

input_groups:
  site:
    display_label: Site
    collapsible: true
    index: 0
    inputs:
      - site_name
      - alert_topic
  health_checks:
    display_label: Health Checks
    collapsible: true
    index: 1
    inputs:
      - web_check_url
      - dns_check_server
      - dns_check_name
      - key_service_name
      - key_service_url
      - check_interval
  ports:
    display_label: Published Ports
    collapsible: true
    index: 2
    inputs:
      - status_port
      - alerts_port
      - speedtest_port
      - toolbox_port
  images:
    display_label: Container Images
    collapsible: true
    index: 3
    inputs:
      - image_registry
  registry_login:
    display_label: Registry Login
    collapsible: true
    index: 4
    inputs:
      - registry_login_enabled
      - registry_url
      - registry_credentials_secret
      - registry_tls_verify

labels:
  csys-obj-type:
    values:
      - environment
  env:
    values:
      - ddpc
  solution:
    values:
      - tme-tech-ops
  version:
    values:
      - "4.3.0"

blueprint_labels:
  env:
    values:
      - ddpc
