tosca_definitions_version: dell_1_1

description: >
  This blueprint creates a connection to a remote host and uses Fabric to install an NGINX file server

imports:
  - dell/types/types.yaml
  - plugin:fabric-plugin?version= >=3.4.3.0,<4.0.0.0
  - remotehost/definitions.yaml
  - remotehost/inputs.yaml
  - remotehost/outputs.yaml

input_groups:
  remote_host:
    display_label: Remote host credentials
    collapsible: false
    index: 0
    inputs:
      - remote_host
      - remote_username
      - ssh_private_key
      - remote_port
  nginx_settings:
    display_label: Nginx Settings
    collapsible: true
    index: 1
    inputs:
      - nginx_credentials_secret
      - enable_http_redirect
      - nginx_port
      - browser_title
      - body_title
      - nginx_debug
  certificate:
    display_label: Self-Signed Certificate
    collapsible: true
    index: 2
    inputs:
      - duration_days
      - common_name
      - country
      - state
      - location
      - organization

labels:
  csys-obj-type:
    values:
      - environment
  env:
    values:
      - remote
  solution:
    values:
      - tme-tech-ops
  version:
    values:
      - "4.0.0"

blueprint_labels:
  env:
    values:
      - remote